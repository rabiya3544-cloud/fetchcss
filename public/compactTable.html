<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<title>Compact Table</title>
<style>
  :root {
    /* ---------- Color tokens ---------- */
    --c-bg:             #ffffff;
    --c-fg:             #1b2026;
    --c-fg-dim:         #5b6672;

    --c-line:           #d3d9df;
    --c-line-soft:      #e9edf1;
    --c-line-strong:    #b8c4d2;

    --c-bg-head:        #f1f4f7;
    --c-bg-foot:        #f7f8fa;
    --c-bg-alt:         #fbfcfd;
/*
    --c-header-grad-a:  #1e293b;
    --c-header-grad-b:  #0f172a;
    --c-header-fg:      #f1f5f9;
    --c-header-shadow:  rgba(15, 23, 42, .35);
    --c-header-sheen:   rgba(255, 255, 255, .06);

    --c-title:          #f8fafc;
    --c-subtitle:       #94a3b8;
*/
    --c-logo-grad-a:    #60a5fa;
    --c-logo-grad-b:    #2563eb;
    --c-logo-fg:        #ffffff;
/*
    --c-logo-shadow:    rgba(37, 99, 235, .55);
*/
    --c-footer-grad-a:  #eef3f9;
    --c-footer-grad-b:  #c9d6e4;
    --c-footer-sheen:   rgba(255, 255, 255, .85);
    --c-footer-shadow:  rgba(15, 23, 42, .06);

    /* ---------- Non-color tokens ---------- */
    --fs: 11px;
    --pad-y: 2px;
    --pad-x: 4px;
    --no-w: 30px;
 
  --c-row-hover:  #e8f0fb;   /* row hover fill */
  --c-row-active: #dbe7f7;   /* row pressed fill (touch) */

  --c-match-bg:      #dcfce7;   /* soft green  */
  --c-match-accent:  #16a34a;
  --c-miss-bg:       #fee2e2;   /* soft red    */
  --c-miss-accent:   #dc2626;


  /* ...existing tokens... */
  --c-header-grad-a:  #eaf1fb;   /* light top    */
  --c-header-grad-b:  #c9d9ee;   /* soft bottom  */
  --c-header-fg:      #1b2026;   /* dark text on light surface */
  --c-header-shadow:  rgba(15, 23, 42, .12);   /* softer outer shadow */
  --c-header-sheen:   rgba(255, 255, 255, .85);/* brighter inner highlight */
  --c-title:    #0f172a;   /* was #f8fafc */
--c-subtitle: #64748b;   /* was #94a3b8 */
--c-logo-shadow: rgba(37, 99, 235, .35);   /* was .55 */
}

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: var(--fs);
    line-height: 1.1;
    color: var(--c-fg);
    background: var(--c-bg);
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- Header ---------- */
  header {
    flex: 0 0 auto;
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px var(--pad-x);
    background: linear-gradient(180deg, var(--c-header-grad-a) 0%, var(--c-header-grad-b) 100%);
    color: var(--c-header-fg);
    box-shadow:
      0 2px 8px var(--c-header-shadow),
      0 1px 0 var(--c-header-sheen) inset;
  }

  .logo {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    border-radius: 5px;
    background: linear-gradient(135deg, var(--c-logo-grad-a) 0%, var(--c-logo-grad-b) 100%);
    color: var(--c-logo-fg);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: -0.02em;
    box-shadow: 0 1px 2px var(--c-logo-shadow);
  }

  .title-group {
    display: flex;
    flex-direction: column;
    min-width: 0;
    line-height: 1;
  }
  .title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--c-title);
  }
  .subtitle {
    margin-top: 2px;
    font-size: 8.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--c-subtitle);
  }

  /* ---------- Footer ---------- */
  footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px var(--pad-x);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: var(--c-fg-dim);
    background: linear-gradient(180deg, var(--c-footer-grad-a) 0%, var(--c-footer-grad-b) 100%);
    border-top: 1px solid var(--c-line-strong);
    box-shadow:
      inset 0 1px 0 var(--c-footer-sheen),
      0 -1px 2px var(--c-footer-shadow);
  }

  .clock {
    display: inline-flex;
    align-items: baseline;
    font-size: 10px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    text-transform: none;
    color: var(--c-fg);
  }
  .clock-colon {
    display: inline-block;
    width: .6em;
    text-align: center;
  }
  .clock-meridiem {
    margin-left: 2px;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--c-fg-dim);
  }

  /* ---------- Main ---------- */
  main {
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
  }

  /* ---------- Table ---------- */
  table {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    font-size: var(--fs);
  }

  thead, tbody, tfoot {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-height: 0;
  }
  thead { flex: 1  1 0; }
  tbody { flex: 31 1 0; }
  tfoot { flex: 1  1 0; }

  tr {
    display: flex;
    flex: 1 1 0;
    width: 100%;
    min-height: 0;
  }

  th, td {
    display: flex;
    align-items: center;
    flex: 1 1 0;
    min-width: 0;
    padding: var(--pad-y) var(--pad-x);
    overflow: hidden;
    border-right: 1px solid var(--c-line);
    box-shadow: inset 0 -1px 0 var(--c-line-soft);
  }

  th:last-child, td:last-child { border-right: 0; }

  th > span, td > span {
    display: block;
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  /* Number column: fixed width, centered by default */
  th[data-col="no"], td[data-col="no"] {
    flex: 0 0 var(--no-w);
    justify-content: center;
    font-variant-numeric: tabular-nums;
    color: var(--c-fg-dim);
  }
  th[data-col="no"] > span, td[data-col="no"] > span {
    flex: 0 1 auto;
    text-align: center;
  }

  /* tbody No. column: right-aligned digits */
  tbody td[data-col="no"] {
    justify-content: flex-end;
  }
  tbody td[data-col="no"] > span {
    text-align: right;
  }

  thead th {
    background: var(--c-bg-head);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--c-fg-dim);
    box-shadow: inset 0 -1px 0 var(--c-line);
  }

  tbody tr:nth-child(even) td { background: var(--c-bg-alt); }
  tbody tr:last-child td { box-shadow: none; }

  tfoot td {
    background: var(--c-bg-foot);
    font-weight: 600;
    box-shadow: inset 0 1px 0 var(--c-line);
  }

  /* ---------- Responsive touch ---------- */
  @media (min-width: 480px) {
    :root { --fs: 12px; --no-w: 38px; --pad-x: 6px; }
    .logo { width: 24px; height: 24px; font-size: 13px; border-radius: 6px; }
    .title { font-size: 12px; }
    .subtitle { font-size: 9px; }
    .clock { font-size: 11px; }
  }
  @media (min-width: 768px) {
    :root { --fs: 13px; --no-w: 46px; --pad-x: 8px; }
    header { gap: 8px; padding: 6px var(--pad-x); }
    .logo { width: 28px; height: 28px; font-size: 15px; }
    .title { font-size: 13px; }
    .subtitle { font-size: 9.5px; }
    .clock { font-size: 12px; }
    .clock-meridiem { font-size: 9px; }
  }

/* Row hover — scoped to tbody so thead/tfoot stay inert */
@media (hover: hover) {
  tbody tr:hover td {
    background: var(--c-row-hover);
  }
}

/* Touch feedback (no :hover on touch devices) */
tbody tr:active td {
  background: var(--c-row-active);
}

/* Smooth the fill change */
tbody td {
  transition: background-color .12s ease;
}

tbody tr:hover td:first-child {
  box-shadow:
    inset 2px 0 0 var(--c-logo-grad-b),   /* 2px accent bar */
    inset 0 -1px 0 var(--c-line-soft);    /* keep the row rule */
}

/* Group 1: matched cells get a left accent border */
tbody td[data-col="group1"].is-matched {
  border-left: 2px solid var(--c-match-accent);
}

/* Smooth the change; safe to add if you haven't already */
tbody td { transition: background-color .12s ease; }
</style>

<script>
  (function () {
    var hourEl     = document.getElementById('clock-h');
    var minEl      = document.getElementById('clock-m');
    var meridiemEl = document.getElementById('clock-meridiem');
    var colonEl    = document.getElementById('clock-colon');

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function tick() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var s = now.getSeconds();

      hourEl.textContent     = pad(h % 12 || 12);
      minEl.textContent      = pad(m);
      meridiemEl.textContent = h >= 12 ? 'PM' : 'AM';

      colonEl.style.visibility = (s % 2 === 0) ? 'visible' : 'hidden';
    }

    tick();

    function schedule() {
      setTimeout(function () {
        tick();
        schedule();
      }, 1000 - (Date.now() % 1000));
    }
    schedule();

  "https://web.telegram.org/a/assets/calls-CQWZKTsy.css"
];

function getFileName(url) {
  // strips query/hash and returns the last path segment
  return url.split(/[?#]/)[0].split("/").pop();
}

function populateGroup1(group1) {
  document
    .querySelectorAll('tbody td[data-col="group1"]')
    .forEach((cell, i) => {
      if (i < group1.length) cell.firstElementChild.textContent = getFileName(group1[i]);
    });
}

function populateGroup2(group2) {
  document
    .querySelectorAll('tbody td[data-col="group2"]')
    .forEach((cell, i) => {
      if (i < group2.length) cell.firstElementChild.textContent = getFileName(group2[i]);
    });
}

function populateGroup2Aligned(group1, group2) {
  const rows = document.querySelectorAll('tbody td[data-col="group2"]');
  
  // clear first, in case this runs more than once
  rows.forEach(cell => { cell.firstElementChild.textContent = ""; });
  
  group2.forEach(url => {
    const g1i = group1.indexOf(url);
    if (g1i !== -1 && g1i < rows.length) {
      rows[g1i].firstElementChild.textContent = getFileName(url);
    }
  });
}

function matchGroup1Indexes(group1, group2, g2 = 0, g1 = 0, acc = []) {
  if (g2 >= group2.length) return acc; // done
  if (g1 >= group1.length) return matchGroup1Indexes(group1, group2, g2 + 1, 0, acc); // next group2 item
  if (group1[g1] === group2[g2]) { // exact match found
    if (!acc.includes(g1)) acc.push(g1); // collect (dedup)
    return matchGroup1Indexes(group1, group2, g2 + 1, 0, acc); // move on
  }
  return matchGroup1Indexes(group1, group2, g2, g1 + 1, acc); // keep scanning group1
}

function applyMatchStyles(matchedGroup1Indexes) {
  const set = new Set(matchedGroup1Indexes);
  document.querySelectorAll('tbody td[data-col="group1"]').forEach((cell, i) => {
    cell.classList.toggle('is-matched', set.has(i));
  });
}

populateGroup1(group1);
populateGroup2Aligned(group1, group2);
applyMatchStyles(matchGroup1Indexes(group1, group2));

})();
</script>
